name: Test components and target
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          components: rustfmt,clippy
          target: wasm32-unknown-unknown
      - name: Assert components and target installed
        run: |
          rustup component list --installed
          rustup component list --installed | grep -q '^rustfmt' || { echo "FAIL: rustfmt missing"; exit 1; }
          rustup component list --installed | grep -q '^clippy' || { echo "FAIL: clippy missing"; exit 1; }
          rustup target list --installed
          rustup target list --installed | grep -qx 'wasm32-unknown-unknown' || { echo "FAIL: target missing"; exit 1; }
          cargo fmt --version
          echo "PASS"
