name: Test Rust toolchain with components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          components: "clippy,rustfmt"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version = $RUSTC_VER"

      - name: Assert clippy is available
        run: |
          which cargo-clippy || (cargo clippy --version && echo "clippy found via cargo")
          echo "Checking clippy..."
          rustup component list --installed | grep clippy
          echo "PASS: clippy is installed"

      - name: Assert rustfmt is available
        run: |
          which rustfmt
          rustfmt --version
          echo "PASS: rustfmt is installed"

      - name: Assert cargo fmt works
        run: |
          cargo fmt --version
          echo "PASS: cargo fmt is available"
