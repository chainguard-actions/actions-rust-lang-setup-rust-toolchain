name: Test rustflags and build-warnings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: "false"
          rustflags: "-D warnings"
          build-warnings: "warn"
      - name: Assert env
        run: |
          echo "RUSTFLAGS=$RUSTFLAGS CARGO_BUILD_WARNINGS=$CARGO_BUILD_WARNINGS"
          [ "$RUSTFLAGS" = "-D warnings" ] || { echo "FAIL: RUSTFLAGS"; exit 1; }
          [ "$CARGO_BUILD_WARNINGS" = "warn" ] || { echo "FAIL: CARGO_BUILD_WARNINGS"; exit 1; }
          echo "PASS"
