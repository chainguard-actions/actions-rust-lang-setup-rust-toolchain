name: Test cache-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "true"
          cache-key: my-custom-cache-key
      - name: Assert rustc-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"
      - name: Assert cachekey is set
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey=$ACTUAL"
