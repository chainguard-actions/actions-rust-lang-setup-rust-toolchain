name: Test cache configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare cargo workspace and extra cache directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cache-crate/src" /tmp/extra-cache-dir
          printf '[package]\nname = "cache-crate"\nversion = "0.1.0"\nedition = "2021"\n\n[dependencies]\n' > "$GITHUB_WORKSPACE/cache-crate/Cargo.toml"
          printf 'fn main() {\n    println!("hello");\n}\n' > "$GITHUB_WORKSPACE/cache-crate/src/main.rs"
          echo data > /tmp/extra-cache-dir/file.txt
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "true"
          cache-workspaces: |
            cache-crate -> target
          cache-directories: |
            /tmp/extra-cache-dir
          cache-key: test-extra-key
          cache-shared-key: test-shared-key
          cache-save-if: "false"
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUSTC: ${{ steps.action.outputs.rustc-version }}
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "outcome: $OUTCOME"; echo "rustc: $RUSTC"; echo "cachekey: $CACHEKEY"
          [ "$OUTCOME" = "success" ] || { echo "FAIL: outcome"; exit 1; }
          case "$RUSTC" in rustc\ 1.*) ;; *) echo "FAIL: bad rustc-version"; exit 1;; esac
          if ! echo "$CACHEKEY" | grep -qE '^20[0-9]{6}[0-9a-f]{4}$'; then
            echo "FAIL: bad cachekey"; exit 1
          fi
          echo "PASS"
      - name: Assert toolchain builds the crate
        working-directory: cache-crate
        run: |
          cargo build
          ./target/debug/cache-crate | grep -q hello || { echo "FAIL: binary output"; exit 1; }
          echo "PASS"
