name: Test cache options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create workspace and cache directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-workspace/target"
          mkdir -p "$GITHUB_WORKSPACE/extra-cache-dir"
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "true"
          cache-workspaces: my-workspace -> my-workspace/target
          cache-directories: extra-cache-dir
          cache-key: test-cache-key
          cache-shared-key: test-shared-key
          cache-on-failure: "true"
          cache-bin: "true"
      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
