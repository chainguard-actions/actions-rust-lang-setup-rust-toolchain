name: Test with cache options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "true"
          cache-workspaces: "."
          cache-directories: "/tmp/rust-cache-test"
          cache-key: "test-cache-key"
          cache-shared-key: "test-shared-key"
          cache-on-failure: "true"
          cache-bin: "true"
          cache-all-crates: "false"
      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustc is available
        run: |
          rustc --version
          echo "PASS: rustc is available"
