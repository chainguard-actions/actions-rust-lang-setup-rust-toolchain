name: Test cache options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "true"
          cache-workspaces: "."
          cache-directories: "/tmp/rust-cache-test"
          cache-key: "test-cache-key"
          cache-shared-key: "test-shared-key"
          cache-on-failure: "true"
          cache-bin: "true"
          cache-provider: "github"
          matcher: "false"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
