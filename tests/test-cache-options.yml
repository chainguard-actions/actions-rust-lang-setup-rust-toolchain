name: Test cache options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Cargo workspace for cache testing
        run: |
          mkdir -p /tmp/rust-workspace/src
          cat > /tmp/rust-workspace/Cargo.toml <<'EOF'
          [package]
          name = "hello"
          version = "0.1.0"
          edition = "2021"
          EOF
          echo 'fn main() {}' > /tmp/rust-workspace/src/main.rs
      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "true"
          cache-workspaces: /tmp/rust-workspace
          cache-directories: /tmp/rust-workspace/target
          cache-key: test-cache-key
          cache-shared-key: test-shared-key
          cache-on-failure: "true"
          cache-bin: "true"
          cache-provider: github
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          override: "true"
          matcher: "false"
          rustflags: ""
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual cachekey: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
