name: Test cache-related inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          cache-workspaces: |
            . -> target
          cache-directories: |
            /tmp/extra-cache-dir
          cache-key: test-extra-key
          cache-shared-key: test-shared-key

      - name: Assert outputs are set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          echo "cargo-version: $CARGO_VERSION"
          echo "cachekey: $CACHEKEY"
          if ! echo "$RUSTC_VERSION" | grep -q "^rustc "; then
            echo "FAIL: rustc-version invalid"
            exit 1
          fi
          if ! echo "$CARGO_VERSION" | grep -q "^cargo "; then
            echo "FAIL: cargo-version invalid"
            exit 1
          fi
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert env vars set by action
        run: |
          echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL RUSTFLAGS=$RUSTFLAGS"
          if [ "$CARGO_INCREMENTAL" != "0" ]; then
            echo "FAIL: CARGO_INCREMENTAL expected 0"
            exit 1
          fi
          if [ "$RUSTFLAGS" != "-D warnings" ]; then
            echo "FAIL: RUSTFLAGS expected '-D warnings'"
            exit 1
          fi
          echo "PASS"
