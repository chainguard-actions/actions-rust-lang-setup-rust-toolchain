name: Test specific toolchain version with components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.80.0"
          components: "rustfmt,clippy"
          cache: "false"

      - name: Assert rustc-version contains 1.80.0
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $ACTUAL"
          if [[ -z "$ACTUAL" ]]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if [[ "$ACTUAL" != *"1.80.0"* ]]; then
            echo "FAIL: expected rustc-version to contain '1.80.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert rustfmt is available
        run: |
          which rustfmt
          rustfmt --version
          echo "PASS: rustfmt is available"

      - name: Assert clippy is available
        run: |
          which cargo-clippy || cargo clippy --version
          echo "PASS: clippy is available"

      - name: Assert cargo-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $ACTUAL"
          if [[ -z "$ACTUAL" ]]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert cachekey is set and non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $ACTUAL"
          if [[ -z "$ACTUAL" ]]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
