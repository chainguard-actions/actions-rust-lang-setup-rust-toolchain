name: Test specific toolchain version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0"
          cache: "false"

      - name: Assert rustc version is 1.70.0
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if ! echo "$RUSTC_VERSION" | grep -q "1\.70\.0"; then
            echo "FAIL: expected rustc version 1.70.0, got: $RUSTC_VERSION"
            exit 1
          fi
          echo "PASS: rustc version is 1.70.0"

      - name: Assert cargo version is 1.70.0
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if ! echo "$CARGO_VERSION" | grep -q "1\.70\.0"; then
            echo "FAIL: expected cargo version 1.70.0, got: $CARGO_VERSION"
            exit 1
          fi
          echo "PASS: cargo version is 1.70.0"

      - name: Assert cachekey is non-empty and 12 chars
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey is empty"
            exit 1
          fi
          LEN=${#CACHEKEY}
          if [ "$LEN" -ne 12 ]; then
            echo "FAIL: cachekey length is $LEN, expected 12"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY (length=$LEN)"
