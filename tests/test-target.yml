name: Test target input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: "false"
      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert target is installed
        run: |
          if ! rustup target list --installed | grep -q "x86_64-unknown-linux-gnu"; then
            echo "FAIL: target x86_64-unknown-linux-gnu not installed"
            exit 1
          fi
          echo "PASS: target x86_64-unknown-linux-gnu is installed"
