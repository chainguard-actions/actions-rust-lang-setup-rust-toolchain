name: Test target input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache: "false"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert target was installed
        run: |
          if ! rustup target list --installed | grep -q "x86_64-unknown-linux-musl"; then
            echo "FAIL: target x86_64-unknown-linux-musl was not installed"
            exit 1
          fi
          echo "PASS"
