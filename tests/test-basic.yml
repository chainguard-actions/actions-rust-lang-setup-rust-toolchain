name: Test basic usage - default stable toolchain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: "false"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if [[ "$ACTUAL" != rustc* ]]; then
            echo "FAIL: rustc-version does not start with 'rustc'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cargo-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "actual cargo-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          if [[ "$ACTUAL" != cargo* ]]; then
            echo "FAIL: cargo-version does not start with 'cargo'"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustup-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "actual rustup-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          if [[ "$ACTUAL" != rustup* ]]; then
            echo "FAIL: rustup-version does not start with 'rustup'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual cachekey: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustc is available
        run: |
          rustc --version
          if [ $? -ne 0 ]; then
            echo "FAIL: rustc is not available"
            exit 1
          fi
          echo "PASS"
      - name: Assert cargo is available
        run: |
          cargo --version
          if [ $? -ne 0 ]; then
            echo "FAIL: cargo is not available"
            exit 1
          fi
          echo "PASS"
