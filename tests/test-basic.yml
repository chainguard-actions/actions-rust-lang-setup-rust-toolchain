name: Test basic usage with toolchain and components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache: "false"
          matcher: "false"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cargo-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustup-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustfmt is installed
        run: |
          rustfmt --version
          echo "PASS: rustfmt is installed"
      - name: Assert clippy is installed
        run: |
          cargo clippy --version
          echo "PASS: clippy is installed"
