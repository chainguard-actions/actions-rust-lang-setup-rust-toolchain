name: Test basic stable toolchain setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VER" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version = $RUSTC_VER"

      - name: Assert cargo-version output is set
        env:
          CARGO_VER: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VER"
          if [ -z "$CARGO_VER" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          if ! echo "$CARGO_VER" | grep -q "^cargo "; then
            echo "FAIL: cargo-version does not start with 'cargo '"
            exit 1
          fi
          echo "PASS: cargo-version = $CARGO_VER"

      - name: Assert rustup-version output is set
        env:
          RUSTUP_VER: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "rustup-version: $RUSTUP_VER"
          if [ -z "$RUSTUP_VER" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTUP_VER" | grep -q "rustup"; then
            echo "FAIL: rustup-version does not contain 'rustup'"
            exit 1
          fi
          echo "PASS: rustup-version = $RUSTUP_VER"

      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey = $CACHEKEY"

      - name: Assert rustc is available on PATH
        run: |
          which rustc
          rustc --version
          echo "PASS: rustc is on PATH"

      - name: Assert cargo is available on PATH
        run: |
          which cargo
          cargo --version
          echo "PASS: cargo is on PATH"
