name: Test basic stable toolchain setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"

      - name: Assert cargo-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "actual cargo-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "^cargo "; then
            echo "FAIL: cargo-version does not start with 'cargo '"
            exit 1
          fi
          echo "PASS: cargo-version=$ACTUAL"

      - name: Assert rustup-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "actual rustup-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "rustup"; then
            echo "FAIL: rustup-version does not contain 'rustup'"
            exit 1
          fi
          echo "PASS: rustup-version=$ACTUAL"

      - name: Assert cachekey output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "actual cachekey: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey=$ACTUAL"

      - name: Assert rustc is available on PATH
        run: |
          if ! command -v rustc &>/dev/null; then
            echo "FAIL: rustc not found on PATH"
            exit 1
          fi
          echo "PASS: rustc found at $(which rustc)"

      - name: Assert cargo is available on PATH
        run: |
          if ! command -v cargo &>/dev/null; then
            echo "FAIL: cargo not found on PATH"
            exit 1
          fi
          echo "PASS: cargo found at $(which cargo)"
