name: Test Rust toolchain build-warnings configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          build-warnings: "warn"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version = $RUSTC_VER"

      - name: Assert CARGO_BUILD_WARNINGS is set to warn
        run: |
          echo "CARGO_BUILD_WARNINGS: ${CARGO_BUILD_WARNINGS:-not set}"
          if [ -z "$CARGO_BUILD_WARNINGS" ]; then
            echo "FAIL: CARGO_BUILD_WARNINGS is not set"
            exit 1
          fi
          if [ "$CARGO_BUILD_WARNINGS" != "warn" ]; then
            echo "FAIL: expected CARGO_BUILD_WARNINGS=warn, got: $CARGO_BUILD_WARNINGS"
            exit 1
          fi
          echo "PASS: CARGO_BUILD_WARNINGS = $CARGO_BUILD_WARNINGS"

      - name: Assert default env vars are set
        run: |
          echo "CARGO_INCREMENTAL: ${CARGO_INCREMENTAL:-not set}"
          echo "CARGO_PROFILE_DEV_DEBUG: ${CARGO_PROFILE_DEV_DEBUG:-not set}"
          echo "CARGO_TERM_COLOR: ${CARGO_TERM_COLOR:-not set}"
          echo "RUST_BACKTRACE: ${RUST_BACKTRACE:-not set}"

          if [ "$CARGO_INCREMENTAL" != "0" ]; then
            echo "FAIL: expected CARGO_INCREMENTAL=0, got: ${CARGO_INCREMENTAL:-not set}"
            exit 1
          fi
          if [ "$CARGO_PROFILE_DEV_DEBUG" != "0" ]; then
            echo "FAIL: expected CARGO_PROFILE_DEV_DEBUG=0, got: ${CARGO_PROFILE_DEV_DEBUG:-not set}"
            exit 1
          fi
          if [ "$CARGO_TERM_COLOR" != "always" ]; then
            echo "FAIL: expected CARGO_TERM_COLOR=always, got: ${CARGO_TERM_COLOR:-not set}"
            exit 1
          fi
          if [ "$RUST_BACKTRACE" != "short" ]; then
            echo "FAIL: expected RUST_BACKTRACE=short, got: ${RUST_BACKTRACE:-not set}"
            exit 1
          fi
          echo "PASS: all default env vars are set correctly"
