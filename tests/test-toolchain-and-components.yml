name: Test toolchain and components inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache: "false"
          matcher: "false"
      - name: Assert rustc-version is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cargo-version is set
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustup-version is set
        env:
          RUSTUP_VERSION: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "rustup-version: $RUSTUP_VERSION"
          if [ -z "$RUSTUP_VERSION" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cachekey is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustfmt is installed
        run: |
          rustfmt --version
          echo "PASS: rustfmt is installed"
      - name: Assert clippy is installed
        run: |
          cargo clippy --version
          echo "PASS: clippy is installed"
