name: Test toolchain setup with invalid rust-src-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          rust-src-dir: /nonexistent/path/that/does/not/exist
        continue-on-error: true

      - name: Assert action failed for invalid rust-src-dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid rust-src-dir, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid rust-src-dir"
