name: Test preexisting env vars preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "1"
      RUST_BACKTRACE: "full"
      RUSTFLAGS: "-C opt-level=1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: "false"
          rustflags: "-D warnings"
      - name: Assert env preserved
        run: |
          echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL RUST_BACKTRACE=$RUST_BACKTRACE RUSTFLAGS=$RUSTFLAGS"
          [ "$CARGO_INCREMENTAL" = "1" ] || { echo "FAIL: CARGO_INCREMENTAL"; exit 1; }
          [ "$RUST_BACKTRACE" = "full" ] || { echo "FAIL: RUST_BACKTRACE"; exit 1; }
          [ "$RUSTFLAGS" = "-C opt-level=1" ] || { echo "FAIL: RUSTFLAGS"; exit 1; }
          echo "PASS"
