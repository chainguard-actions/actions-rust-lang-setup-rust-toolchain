name: Test environment variables are set correctly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "stable"
          cache: "false"

      - name: Assert CARGO_INCREMENTAL is set to 0
        run: |
          echo "CARGO_INCREMENTAL: $CARGO_INCREMENTAL"
          if [[ "$CARGO_INCREMENTAL" != "0" ]]; then
            echo "FAIL: expected CARGO_INCREMENTAL='0', got '$CARGO_INCREMENTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert CARGO_PROFILE_DEV_DEBUG is set to 0
        run: |
          echo "CARGO_PROFILE_DEV_DEBUG: $CARGO_PROFILE_DEV_DEBUG"
          if [[ "$CARGO_PROFILE_DEV_DEBUG" != "0" ]]; then
            echo "FAIL: expected CARGO_PROFILE_DEV_DEBUG='0', got '$CARGO_PROFILE_DEV_DEBUG'"
            exit 1
          fi
          echo "PASS"

      - name: Assert CARGO_TERM_COLOR is set to always
        run: |
          echo "CARGO_TERM_COLOR: $CARGO_TERM_COLOR"
          if [[ "$CARGO_TERM_COLOR" != "always" ]]; then
            echo "FAIL: expected CARGO_TERM_COLOR='always', got '$CARGO_TERM_COLOR'"
            exit 1
          fi
          echo "PASS"

      - name: Assert RUST_BACKTRACE is set to short
        run: |
          echo "RUST_BACKTRACE: $RUST_BACKTRACE"
          if [[ "$RUST_BACKTRACE" != "short" ]]; then
            echo "FAIL: expected RUST_BACKTRACE='short', got '$RUST_BACKTRACE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert RUSTFLAGS is set to -D warnings
        run: |
          echo "RUSTFLAGS: $RUSTFLAGS"
          if [[ "$RUSTFLAGS" != "-D warnings" ]]; then
            echo "FAIL: expected RUSTFLAGS='-D warnings', got '$RUSTFLAGS'"
            exit 1
          fi
          echo "PASS"

      - name: Assert CARGO_REGISTRIES_CRATES_IO_PROTOCOL is set to sparse
        run: |
          echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL: $CARGO_REGISTRIES_CRATES_IO_PROTOCOL"
          if [[ "$CARGO_REGISTRIES_CRATES_IO_PROTOCOL" != "sparse" ]]; then
            echo "FAIL: expected CARGO_REGISTRIES_CRATES_IO_PROTOCOL='sparse', got '$CARGO_REGISTRIES_CRATES_IO_PROTOCOL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert cachekey output format
        env:
          ACTUAL: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $ACTUAL"
          if [[ -z "$ACTUAL" ]]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          # cachekey should be 12 chars (date YYYYMMDD + first 4 chars of hash)
          LEN=${#ACTUAL}
          echo "cachekey length: $LEN"
          if [[ $LEN -ne 12 ]]; then
            echo "FAIL: expected cachekey length 12, got $LEN"
            exit 1
          fi
          echo "PASS"
