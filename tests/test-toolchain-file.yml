name: Test rust-toolchain.toml file detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create rust-toolchain.toml file
        run: |
          cat > rust-toolchain.toml << 'EOF'
          [toolchain]
          channel = "1.72.0"
          EOF
          cat rust-toolchain.toml

      - id: action
        uses: .
        with:
          # No toolchain input - should use rust-toolchain.toml
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VERSION" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert toolchain from file is installed (1.72.0)
        run: |
          ACTUAL=$(rustc --version)
          echo "rustc --version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "1\.72\.0"; then
            echo "FAIL: expected 1.72.0 from rust-toolchain.toml, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: toolchain from rust-toolchain.toml was used"

      - name: Cleanup rust-toolchain.toml
        if: always()
        run: rm -f rust-toolchain.toml
