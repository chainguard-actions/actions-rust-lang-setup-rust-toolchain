name: Test toolchain installation from rust-toolchain.toml file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create rust-toolchain.toml file
        run: |
          cat > rust-toolchain.toml << 'EOF'
          [toolchain]
          channel = "1.71.0"
          components = ["rustfmt", "clippy"]
          EOF
          echo "Created rust-toolchain.toml:"
          cat rust-toolchain.toml

      - id: action
        uses: .
        with:
          # No toolchain input — should read from rust-toolchain.toml
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert version matches rust-toolchain.toml
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if ! echo "$RUSTC_VERSION" | grep -q "1\.71\.0"; then
            echo "FAIL: expected version 1.71.0 from rust-toolchain.toml but got: $RUSTC_VERSION"
            exit 1
          fi
          echo "PASS: version 1.71.0 installed from rust-toolchain.toml"

      - name: Assert cargo-version output is set
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS: cargo-version=$CARGO_VERSION"

      - name: Cleanup rust-toolchain.toml
        if: always()
        run: rm -f rust-toolchain.toml
