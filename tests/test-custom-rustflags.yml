name: Test custom RUSTFLAGS configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          rustflags: "--cfg test_feature"
          cache: "false"

      - name: Assert RUSTFLAGS is set to custom value
        run: |
          echo "RUSTFLAGS: $RUSTFLAGS"
          if [ -z "$RUSTFLAGS" ]; then
            echo "FAIL: RUSTFLAGS is not set"
            exit 1
          fi
          if [ "$RUSTFLAGS" != "--cfg test_feature" ]; then
            echo "FAIL: expected RUSTFLAGS='--cfg test_feature' but got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: RUSTFLAGS=$RUSTFLAGS"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"
