name: Test custom RUSTFLAGS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: "stable"
          cache: "false"
          rustflags: "-D warnings -D unused"
      - name: Assert RUSTFLAGS is set to custom value
        run: |
          echo "RUSTFLAGS=$RUSTFLAGS"
          if [[ "$RUSTFLAGS" != "-D warnings -D unused" ]]; then
            echo "FAIL: expected RUSTFLAGS='-D warnings -D unused', got '$RUSTFLAGS'"
            exit 1
          fi
          echo "PASS: RUSTFLAGS=$RUSTFLAGS"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [[ -z "$ACTUAL" ]]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"
