name: Test toolchain setup with custom rustflags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          rustflags: "-D warnings -D unused-imports"

      - name: Assert RUSTFLAGS is set to custom value
        run: |
          echo "RUSTFLAGS=$RUSTFLAGS"
          if [ "$RUSTFLAGS" != "-D warnings -D unused-imports" ]; then
            echo "FAIL: RUSTFLAGS should be '-D warnings -D unused-imports', got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: RUSTFLAGS is set correctly"

      - name: Assert rustc is available
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
