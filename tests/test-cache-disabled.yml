name: Test Rust toolchain with cache disabled and custom rustflags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          rustflags: ""

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert RUSTFLAGS is not set (empty rustflags input)
        run: |
          echo "RUSTFLAGS='$RUSTFLAGS'"
          # When rustflags input is empty string, RUSTFLAGS should not be set by the action
          # (the action only sets it if NEW_RUSTFLAGS != "")
          # If RUSTFLAGS was already set in the environment, it won't be overwritten
          # We just verify the action ran successfully without error
          echo "PASS: action completed without error when rustflags is empty"

      - name: Assert cargo is functional
        run: |
          cargo --version
          echo "PASS: cargo is functional"

      - name: Assert rustup is functional
        run: |
          rustup --version
          rustup show
          echo "PASS: rustup is functional"
