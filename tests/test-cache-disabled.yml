name: Test toolchain setup with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert environment variables are set
        run: |
          echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
          echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
          echo "CARGO_TERM_COLOR=$CARGO_TERM_COLOR"
          echo "RUST_BACKTRACE=$RUST_BACKTRACE"
          echo "RUSTFLAGS=$RUSTFLAGS"

          if [ "$CARGO_INCREMENTAL" != "0" ]; then
            echo "FAIL: CARGO_INCREMENTAL should be 0, got: $CARGO_INCREMENTAL"
            exit 1
          fi
          if [ "$CARGO_PROFILE_DEV_DEBUG" != "0" ]; then
            echo "FAIL: CARGO_PROFILE_DEV_DEBUG should be 0, got: $CARGO_PROFILE_DEV_DEBUG"
            exit 1
          fi
          if [ "$CARGO_TERM_COLOR" != "always" ]; then
            echo "FAIL: CARGO_TERM_COLOR should be 'always', got: $CARGO_TERM_COLOR"
            exit 1
          fi
          if [ "$RUST_BACKTRACE" != "short" ]; then
            echo "FAIL: RUST_BACKTRACE should be 'short', got: $RUST_BACKTRACE"
            exit 1
          fi
          if [ "$RUSTFLAGS" != "-D warnings" ]; then
            echo "FAIL: RUSTFLAGS should be '-D warnings', got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: all environment variables are set correctly"
