name: Test Rust toolchain with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          matcher: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VER" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version = $RUSTC_VER"

      - name: Assert cargo-version output is set
        env:
          CARGO_VER: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VER"
          if [ -z "$CARGO_VER" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS: cargo-version = $CARGO_VER"

      - name: Assert rustup-version output is set
        env:
          RUSTUP_VER: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "rustup-version: $RUSTUP_VER"
          if [ -z "$RUSTUP_VER" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          echo "PASS: rustup-version = $RUSTUP_VER"

      - name: Assert environment variables are set
        run: |
          echo "CARGO_INCREMENTAL: ${CARGO_INCREMENTAL:-not set}"
          echo "CARGO_PROFILE_DEV_DEBUG: ${CARGO_PROFILE_DEV_DEBUG:-not set}"
          echo "CARGO_TERM_COLOR: ${CARGO_TERM_COLOR:-not set}"
          echo "RUST_BACKTRACE: ${RUST_BACKTRACE:-not set}"

          if [ -z "$CARGO_INCREMENTAL" ]; then
            echo "FAIL: CARGO_INCREMENTAL is not set"
            exit 1
          fi
          if [ -z "$CARGO_PROFILE_DEV_DEBUG" ]; then
            echo "FAIL: CARGO_PROFILE_DEV_DEBUG is not set"
            exit 1
          fi
          if [ -z "$CARGO_TERM_COLOR" ]; then
            echo "FAIL: CARGO_TERM_COLOR is not set"
            exit 1
          fi
          if [ -z "$RUST_BACKTRACE" ]; then
            echo "FAIL: RUST_BACKTRACE is not set"
            exit 1
          fi
          echo "PASS: all expected environment variables are set"
