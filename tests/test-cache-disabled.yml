name: Test cache disabled with custom rustflags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "stable"
          cache: "false"
          rustflags: ""

      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"

      - name: Assert RUSTFLAGS is not set when rustflags input is empty
        run: |
          echo "RUSTFLAGS='$RUSTFLAGS'"
          if [ -n "$RUSTFLAGS" ]; then
            echo "FAIL: expected RUSTFLAGS to be unset/empty when rustflags input is empty string, got '$RUSTFLAGS'"
            exit 1
          fi
          echo "PASS: RUSTFLAGS is not set"

      - name: Assert CARGO_INCREMENTAL is set to 0
        run: |
          echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
          if [ "$CARGO_INCREMENTAL" != "0" ]; then
            echo "FAIL: expected CARGO_INCREMENTAL=0, got '$CARGO_INCREMENTAL'"
            exit 1
          fi
          echo "PASS: CARGO_INCREMENTAL=0"

      - name: Assert CARGO_TERM_COLOR is set
        run: |
          echo "CARGO_TERM_COLOR=$CARGO_TERM_COLOR"
          if [ -z "$CARGO_TERM_COLOR" ]; then
            echo "FAIL: CARGO_TERM_COLOR is not set"
            exit 1
          fi
          echo "PASS: CARGO_TERM_COLOR=$CARGO_TERM_COLOR"

      - name: Assert RUST_BACKTRACE is set
        run: |
          echo "RUST_BACKTRACE=$RUST_BACKTRACE"
          if [ -z "$RUST_BACKTRACE" ]; then
            echo "FAIL: RUST_BACKTRACE is not set"
            exit 1
          fi
          echo "PASS: RUST_BACKTRACE=$RUST_BACKTRACE"
