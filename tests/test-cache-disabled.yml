name: Test Rust toolchain with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"

      - name: Assert CARGO_INCREMENTAL env var is set
        run: |
          echo "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
          if [ "$CARGO_INCREMENTAL" != "0" ]; then
            echo "FAIL: expected CARGO_INCREMENTAL=0, got: $CARGO_INCREMENTAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert CARGO_PROFILE_DEV_DEBUG env var is set
        run: |
          echo "CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"
          if [ "$CARGO_PROFILE_DEV_DEBUG" != "0" ]; then
            echo "FAIL: expected CARGO_PROFILE_DEV_DEBUG=0, got: $CARGO_PROFILE_DEV_DEBUG"
            exit 1
          fi
          echo "PASS"

      - name: Assert CARGO_TERM_COLOR env var is set
        run: |
          echo "CARGO_TERM_COLOR=$CARGO_TERM_COLOR"
          if [ "$CARGO_TERM_COLOR" != "always" ]; then
            echo "FAIL: expected CARGO_TERM_COLOR=always, got: $CARGO_TERM_COLOR"
            exit 1
          fi
          echo "PASS"

      - name: Assert RUST_BACKTRACE env var is set
        run: |
          echo "RUST_BACKTRACE=$RUST_BACKTRACE"
          if [ "$RUST_BACKTRACE" != "short" ]; then
            echo "FAIL: expected RUST_BACKTRACE=short, got: $RUST_BACKTRACE"
            exit 1
          fi
          echo "PASS"

      - name: Assert RUSTFLAGS env var is set to default
        run: |
          echo "RUSTFLAGS=$RUSTFLAGS"
          if [ "$RUSTFLAGS" != "-D warnings" ]; then
            echo "FAIL: expected RUSTFLAGS='-D warnings', got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS"
