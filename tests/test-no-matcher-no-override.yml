name: Test Rust toolchain with matcher and override disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          matcher: "false"
          override: "false"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VERSION" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert cargo-version output is set
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS: cargo-version=$CARGO_VERSION"

      - name: Assert rustup-version output is set
        env:
          RUSTUP_VERSION: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "rustup-version: $RUSTUP_VERSION"
          if [ -z "$RUSTUP_VERSION" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          echo "PASS: rustup-version=$RUSTUP_VERSION"

      - name: Assert cachekey output is set and has expected format
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          # cachekey should be 12 chars (date YYYYMMDD + first 4 chars of commit hash)
          LEN=${#CACHEKEY}
          echo "cachekey length: $LEN"
          if [ "$LEN" -ne 12 ]; then
            echo "FAIL: expected cachekey length 12, got: $LEN"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY (length=$LEN)"

      - name: Assert rustc is functional
        run: |
          rustc --version
          echo "PASS: rustc is functional"
