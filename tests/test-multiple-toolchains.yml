name: Test multiple toolchain installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0,stable"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert cargo-version output is set
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS: cargo-version=$CARGO_VERSION"

      - name: Assert both toolchains are installed
        run: |
          # Check that 1.70.0 is installed
          if ! rustup toolchain list | grep -q "1.70.0"; then
            echo "FAIL: toolchain 1.70.0 not found in rustup toolchain list"
            exit 1
          fi
          echo "PASS: toolchain 1.70.0 is installed"
          # Check that stable is installed
          if ! rustup toolchain list | grep -q "stable"; then
            echo "FAIL: toolchain stable not found in rustup toolchain list"
            exit 1
          fi
          echo "PASS: toolchain stable is installed"

      - name: Assert stable is the active toolchain (last in list)
        run: |
          ACTIVE=$(rustup show active-toolchain 2>/dev/null || rustc --version)
          echo "Active toolchain info: $ACTIVE"
          # The active toolchain should be stable (last in the comma-separated list)
          RUSTC_VER=$(rustc --version)
          echo "rustc --version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc --version returned empty"
            exit 1
          fi
          echo "PASS: active toolchain is set"
