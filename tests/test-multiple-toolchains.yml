name: Test multiple toolchains installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0,stable"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert default toolchain is stable (last in list)
        run: |
          ACTIVE=$(rustup show active-toolchain)
          echo "active toolchain: $ACTIVE"
          # The last toolchain in the list (stable) should be the override
          if ! echo "$ACTIVE" | grep -q "stable"; then
            echo "FAIL: expected stable to be the active toolchain (last in list), got: $ACTIVE"
            exit 1
          fi
          echo "PASS: stable is the active toolchain"

      - name: Assert both toolchains are installed
        run: |
          TOOLCHAINS=$(rustup toolchain list)
          echo "installed toolchains: $TOOLCHAINS"
          if ! echo "$TOOLCHAINS" | grep -q "1\.70\.0"; then
            echo "FAIL: 1.70.0 toolchain not found in installed toolchains"
            exit 1
          fi
          if ! echo "$TOOLCHAINS" | grep -q "stable"; then
            echo "FAIL: stable toolchain not found in installed toolchains"
            exit 1
          fi
          echo "PASS: both toolchains are installed"
