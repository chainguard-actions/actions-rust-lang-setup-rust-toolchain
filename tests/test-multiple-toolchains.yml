name: Test multiple Rust toolchains installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0,stable"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VER" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version = $RUSTC_VER"

      - name: Assert stable toolchain is the default (last in list)
        run: |
          ACTIVE=$(rustup show active-toolchain)
          echo "Active toolchain: $ACTIVE"
          if ! echo "$ACTIVE" | grep -q "stable"; then
            echo "FAIL: expected stable to be the active toolchain (last in list), got: $ACTIVE"
            exit 1
          fi
          echo "PASS: stable is the active toolchain"

      - name: Assert 1.70.0 toolchain is also installed
        run: |
          INSTALLED=$(rustup toolchain list)
          echo "Installed toolchains: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q "1\.70\.0"; then
            echo "FAIL: 1.70.0 toolchain is not installed"
            exit 1
          fi
          echo "PASS: 1.70.0 toolchain is installed"

      - name: Assert cachekey is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey = $CACHEKEY"
