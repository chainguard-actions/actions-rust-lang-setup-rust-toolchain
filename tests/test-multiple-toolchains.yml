name: Test multiple toolchains (last becomes default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0,1.72.0"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $ACTUAL"
          if [[ -z "$ACTUAL" ]]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert last toolchain (1.72.0) is the active default
        run: |
          VERSION=$(rustc --version)
          echo "Active rustc: $VERSION"
          if [[ "$VERSION" != *"1.72.0"* ]]; then
            echo "FAIL: expected active rustc to be 1.72.0 (last in list), got '$VERSION'"
            exit 1
          fi
          echo "PASS: last toolchain is the active default"

      - name: Assert both toolchains are installed
        run: |
          rustup toolchain list | grep "1.70.0"
          rustup toolchain list | grep "1.72.0"
          echo "PASS: both toolchains are installed"
