name: Test rust-src-dir with toolchain file in subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Rust sub-directory with toolchain file
        run: |
          mkdir -p rust-subdir
          cat > rust-subdir/rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.85.0"
          profile = "minimal"
          EOF
          cat rust-subdir/rust-toolchain.toml

      - id: action
        uses: .
        with:
          rust-src-dir: rust-subdir
          cache: "false"

      - name: Assert rustc-version reflects toolchain file in rust-src-dir
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if ! echo "$RUSTC_VERSION" | grep -q "^rustc 1\.85\.0"; then
            echo "FAIL: expected rustc 1.85.0 from rust-subdir/rust-toolchain.toml"
            exit 1
          fi
          echo "PASS"

      - name: Assert rustc in rust-subdir is 1.85.0
        working-directory: rust-subdir
        run: |
          v="$(rustc --version)"
          echo "rustc in subdir: $v"
          if ! echo "$v" | grep -q "^rustc 1\.85\.0"; then
            echo "FAIL: expected rustc 1.85.0 in rust-subdir"
            exit 1
          fi
          echo "PASS"
