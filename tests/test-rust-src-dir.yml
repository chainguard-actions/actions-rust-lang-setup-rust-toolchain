name: Test rust-src-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a Rust source subdirectory
        run: |
          mkdir -p rust-src
          cat > rust-src/rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "stable"
          EOF
      - id: action
        uses: .
        with:
          rust-src-dir: "rust-src"
          cache: "false"
      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
