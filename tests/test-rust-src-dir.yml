name: Test rust-src-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create rust source subdirectory
        run: |
          mkdir -p /tmp/rust-src-subdir
          cat > /tmp/rust-src-subdir/rust-toolchain.toml << 'EOF'
          [toolchain]
          channel = "stable"
          EOF
      - id: action
        uses: .
        with:
          toolchain: stable
          rust-src-dir: /tmp/rust-src-subdir
          cache: "false"
          matcher: "false"
      - name: Assert rustc-version is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cargo-version is set
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS"
