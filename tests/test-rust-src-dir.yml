name: Test Rust toolchain with rust-src-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory with rust-toolchain.toml
        run: |
          mkdir -p tests/fixtures/rust-subdir
          cat > tests/fixtures/rust-subdir/rust-toolchain.toml << 'EOF'
          [toolchain]
          channel = "1.75.0"
          EOF
          cat tests/fixtures/rust-subdir/rust-toolchain.toml

      - id: action
        uses: .
        with:
          # No toolchain input — should read from rust-toolchain.toml in rust-src-dir
          rust-src-dir: "tests/fixtures/rust-subdir"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VERSION" | grep -q "^rustc "; then
            echo "FAIL: rustc-version does not start with 'rustc '"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert rustc version matches toolchain file in subdirectory
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if ! echo "$RUSTC_VERSION" | grep -q "1\.75\.0"; then
            echo "FAIL: expected rustc 1.75.0 (from rust-toolchain.toml in subdir), got: $RUSTC_VERSION"
            exit 1
          fi
          echo "PASS: rustc version matches rust-toolchain.toml in subdirectory"

      - name: Assert cargo-version output is set
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS: cargo-version=$CARGO_VERSION"

      - name: Assert cachekey output is set
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY"
