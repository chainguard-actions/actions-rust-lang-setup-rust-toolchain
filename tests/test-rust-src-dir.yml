name: Test rust-src-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create rust source subdirectory
        run: |
          mkdir -p $GITHUB_WORKSPACE/rust-subdir/src
          cat > $GITHUB_WORKSPACE/rust-subdir/Cargo.toml << 'EOF'
          [package]
          name = "rust-subdir"
          version = "0.1.0"
          edition = "2021"
          EOF
          echo 'fn main() {}' > $GITHUB_WORKSPACE/rust-subdir/src/main.rs
      - id: action
        uses: .
        with:
          toolchain: stable
          rust-src-dir: rust-subdir
          cache: "false"
          matcher: "false"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"
      - name: Assert cargo-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS: cargo-version=$ACTUAL"
      - name: Assert rustup-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          echo "PASS: rustup-version=$ACTUAL"
