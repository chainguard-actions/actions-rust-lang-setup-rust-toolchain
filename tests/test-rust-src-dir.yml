name: Test rust-src-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a Rust source directory
        run: |
          mkdir -p /tmp/rust-src/src
          cat > /tmp/rust-src/Cargo.toml << 'EOF'
          [package]
          name = "hello"
          version = "0.1.0"
          edition = "2021"
          EOF
          cat > /tmp/rust-src/src/main.rs << 'EOF'
          fn main() {
              println!("Hello, world!");
          }
          EOF
      - id: action
        uses: .
        with:
          toolchain: stable
          rust-src-dir: /tmp/rust-src
          cache: "false"
          matcher: "false"
          rustflags: ""
      - name: Assert rustc-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cargo-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustup-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustup-version }}
        run: |
          echo "rustup-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustup-version output is empty"
            exit 1
          fi
          echo "PASS"
