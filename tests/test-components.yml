name: Test toolchain setup with components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          components: clippy,rustfmt
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert clippy is available
        run: |
          which cargo-clippy || (cargo clippy --version && echo "clippy found via cargo")
          echo "PASS: clippy is available"

      - name: Assert rustfmt is available
        run: |
          which rustfmt
          rustfmt --version
          echo "PASS: rustfmt is available"
