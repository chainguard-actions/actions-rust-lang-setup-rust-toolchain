name: Test with components and target
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          components: clippy,rustfmt
          target: x86_64-unknown-linux-musl
          cache: "false"
      - name: Assert rustc-version output is set
        env:
          RUSTC_VER: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VER"
          if [ -z "$RUSTC_VER" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert clippy is available
        run: |
          cargo clippy --version
          echo "PASS: clippy is available"
      - name: Assert rustfmt is available
        run: |
          rustfmt --version
          echo "PASS: rustfmt is available"
      - name: Assert target is installed
        run: |
          rustup target list --installed | grep x86_64-unknown-linux-musl
          echo "PASS: target x86_64-unknown-linux-musl is installed"
