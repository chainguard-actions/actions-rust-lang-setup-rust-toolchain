name: Test toolchain with additional components
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          components: "clippy,rustfmt"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert clippy is installed
        run: |
          if ! command -v cargo-clippy &>/dev/null && ! rustup component list --installed | grep -q "clippy"; then
            echo "FAIL: clippy not found"
            exit 1
          fi
          echo "PASS: clippy is installed"

      - name: Assert rustfmt is installed
        run: |
          if ! command -v rustfmt &>/dev/null && ! rustup component list --installed | grep -q "rustfmt"; then
            echo "FAIL: rustfmt not found"
            exit 1
          fi
          echo "PASS: rustfmt is installed"

      - name: Verify clippy runs
        run: |
          cargo clippy --version
          echo "PASS: cargo clippy --version succeeded"

      - name: Verify rustfmt runs
        run: |
          rustfmt --version
          echo "PASS: rustfmt --version succeeded"
