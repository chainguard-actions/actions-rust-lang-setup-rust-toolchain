name: Test with target and components inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: rustfmt,clippy
          cache: "false"
          matcher: "false"
      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert rustfmt is installed
        run: |
          if ! command -v rustfmt &> /dev/null; then
            echo "FAIL: rustfmt not found"
            exit 1
          fi
          echo "rustfmt version: $(rustfmt --version)"
          echo "PASS"
      - name: Assert clippy is installed
        run: |
          if ! command -v cargo-clippy &> /dev/null && ! rustup component list --installed | grep -q clippy; then
            echo "FAIL: clippy not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert target is installed
        run: |
          if ! rustup target list --installed | grep -q "x86_64-unknown-linux-gnu"; then
            echo "FAIL: target x86_64-unknown-linux-gnu not installed"
            exit 1
          fi
          echo "PASS"
