name: Test empty rustflags does not set RUSTFLAGS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          rustflags: ""
          cache: "false"

      - name: Assert RUSTFLAGS is not set when rustflags input is empty
        run: |
          echo "RUSTFLAGS: '${RUSTFLAGS}'"
          # When rustflags input is empty string, RUSTFLAGS should NOT be set by the action
          # (the action only sets it if the input is non-empty)
          if [ -n "$RUSTFLAGS" ]; then
            echo "FAIL: RUSTFLAGS should not be set when rustflags input is empty, got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: RUSTFLAGS is not set (as expected)"

      - name: Assert rustc still works
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          rustc --version
          echo "PASS"
