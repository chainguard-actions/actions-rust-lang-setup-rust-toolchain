name: Test toolchain setup with empty rustflags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          rustflags: ""

      - name: Assert RUSTFLAGS is not set when rustflags input is empty
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS:-<unset>}"
          # When rustflags input is empty string, RUSTFLAGS should NOT be set
          if [ -n "$RUSTFLAGS" ]; then
            echo "FAIL: RUSTFLAGS should be unset when rustflags input is empty, got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: RUSTFLAGS is not set as expected"

      - name: Assert rustc is available
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS"
