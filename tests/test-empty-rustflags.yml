name: Test Rust toolchain with empty rustflags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          cache: "false"
          rustflags: ""

      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"

      - name: Assert RUSTFLAGS env var is NOT set when rustflags input is empty
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS:-<unset>}"
          # When rustflags input is empty string, the action should NOT set RUSTFLAGS
          if [ -n "$RUSTFLAGS" ]; then
            echo "FAIL: expected RUSTFLAGS to be unset/empty, got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: RUSTFLAGS is not set"
