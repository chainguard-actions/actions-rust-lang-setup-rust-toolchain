name: Test toolchain setup with target triple
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          target: "wasm32-unknown-unknown"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert wasm32 target is installed
        run: |
          TARGETS=$(rustup target list --installed)
          echo "Installed targets:"
          echo "$TARGETS"
          if ! echo "$TARGETS" | grep -q "wasm32-unknown-unknown"; then
            echo "FAIL: wasm32-unknown-unknown target not found in installed targets"
            exit 1
          fi
          echo "PASS: wasm32-unknown-unknown target is installed"
