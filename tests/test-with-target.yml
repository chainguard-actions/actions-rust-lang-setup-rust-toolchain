name: Test Rust toolchain with target triple
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: stable
          target: "x86_64-unknown-linux-musl"
          cache: "false"

      - name: Assert rustc-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual rustc-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          echo "PASS: rustc-version=$ACTUAL"

      - name: Assert target is installed
        run: |
          echo "Installed targets:"
          rustup target list --installed
          if ! rustup target list --installed | grep -q "x86_64-unknown-linux-musl"; then
            echo "FAIL: target x86_64-unknown-linux-musl not found in installed targets"
            exit 1
          fi
          echo "PASS: target x86_64-unknown-linux-musl is installed"
