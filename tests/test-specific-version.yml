name: Test specific toolchain version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolchain: "1.75.0"
          cache: "false"
      - name: Assert version
        env:
          ACTUAL: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in rustc\ 1.75.0*) ;; *) echo "FAIL: expected rustc 1.75.0"; exit 1;; esac
          rustc --version | grep -q '^rustc 1.75.0' || { echo "FAIL: override not active"; exit 1; }
          echo "PASS"
