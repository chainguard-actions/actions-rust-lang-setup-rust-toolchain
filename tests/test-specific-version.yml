name: Test specific Rust version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0"
          cache: "false"

      - name: Assert rustc version matches requested version
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VERSION" | grep -q "1\.70\.0"; then
            echo "FAIL: expected version 1.70.0 but got: $RUSTC_VERSION"
            exit 1
          fi
          echo "PASS: correct version installed: $RUSTC_VERSION"

      - name: Assert cachekey is set and has expected format
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          # cachekey should be 12 chars (date + hash prefix)
          LEN=${#CACHEKEY}
          echo "cachekey length: $LEN"
          if [ "$LEN" -ne 12 ]; then
            echo "FAIL: expected cachekey length 12, got $LEN"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY"

      - name: Assert RUSTFLAGS env var is set
        run: |
          echo "RUSTFLAGS: $RUSTFLAGS"
          if [ -z "$RUSTFLAGS" ]; then
            echo "FAIL: RUSTFLAGS is not set"
            exit 1
          fi
          if [ "$RUSTFLAGS" != "-D warnings" ]; then
            echo "FAIL: expected RUSTFLAGS='-D warnings' but got: $RUSTFLAGS"
            exit 1
          fi
          echo "PASS: RUSTFLAGS=$RUSTFLAGS"
