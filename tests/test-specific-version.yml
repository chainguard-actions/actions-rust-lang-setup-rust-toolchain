name: Test specific Rust toolchain version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          toolchain: "1.70.0"
          cache: "false"

      - name: Assert rustc-version matches 1.70.0
        env:
          RUSTC_VERSION: ${{ steps.action.outputs.rustc-version }}
        run: |
          echo "rustc-version: $RUSTC_VERSION"
          if [ -z "$RUSTC_VERSION" ]; then
            echo "FAIL: rustc-version output is empty"
            exit 1
          fi
          if ! echo "$RUSTC_VERSION" | grep -q "1\.70\.0"; then
            echo "FAIL: expected rustc-version to contain '1.70.0', got: $RUSTC_VERSION"
            exit 1
          fi
          echo "PASS: rustc-version=$RUSTC_VERSION"

      - name: Assert cargo-version matches 1.70.0
        env:
          CARGO_VERSION: ${{ steps.action.outputs.cargo-version }}
        run: |
          echo "cargo-version: $CARGO_VERSION"
          if [ -z "$CARGO_VERSION" ]; then
            echo "FAIL: cargo-version output is empty"
            exit 1
          fi
          if ! echo "$CARGO_VERSION" | grep -q "1\.70\.0"; then
            echo "FAIL: expected cargo-version to contain '1.70.0', got: $CARGO_VERSION"
            exit 1
          fi
          echo "PASS: cargo-version=$CARGO_VERSION"

      - name: Assert cachekey is non-empty
        env:
          CACHEKEY: ${{ steps.action.outputs.cachekey }}
        run: |
          echo "cachekey: $CACHEKEY"
          if [ -z "$CACHEKEY" ]; then
            echo "FAIL: cachekey output is empty"
            exit 1
          fi
          echo "PASS: cachekey=$CACHEKEY"

      - name: Assert rustc version via CLI
        run: |
          ACTUAL=$(rustc --version)
          echo "rustc --version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "1\.70\.0"; then
            echo "FAIL: expected rustc 1.70.0, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
