# Create tags with only major or major.minor version
# This runs for every created release. Releases are expected to use vmajor.minor.patch as tags.

name: Autotag Release
on:
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  autotag_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get version from tag
        id: tag_name
        run: |
          raw_version="${GITHUB_REF#refs/tags/}"
          safe_version="$(printf '%s' "$raw_version" | tr -d '\n\r')"
          echo "current_version=${safe_version}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Create and push tags
        env:
          CURRENT_VERSION: ${{ steps.tag_name.outputs.current_version }}
        run: |
          MINOR="$(echo -n "$CURRENT_VERSION" | cut -d. -f1-2)"
          MAJOR="$(echo -n "$CURRENT_VERSION" | cut -d. -f1)"
          git tag -f "${MINOR}"
          git tag -f "${MAJOR}"
          git push -f origin "${MINOR}"
          git push -f origin "${MAJOR}"
